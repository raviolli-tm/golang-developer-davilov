run:
  tests: true
  build-tags:
    - bench
    - !bench

linters-settings:
  funlen:
    lines: 150
    statements: 80

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
            
linters:
  disable-all: true
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - durationcheck
    - errorlint
    - exportloopref
    - gocritic
    - gofmt
    - goprintffuncname
    - gosimple
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - predeclared
    - staticcheck
    - thelper
    - typecheck
    - unconvert
    - unused
    - whitespace
