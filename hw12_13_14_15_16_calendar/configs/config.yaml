logger:
  level: "${LOG_LEVEL:-INFO}"
  file:
    enabled: false
    destination:
      - "./log/"
  stdout:
    enabled: true
  remote:
    enabled: false

storage_type: "${STORAGE_TYPE:-postgres}"

http:
  host: "${HTTP_HOST:-0.0.0.0}"
  port: ${HTTP_PORT:-8888}


postgres:
  host: "${POSTGRES_HOST:-postgres}"
  port: ${POSTGRES_PORT:-5432}
  database: "${POSTGRES_DB:-postgres_db}"
  username: "${POSTGRES_USER:-postgres_user}"
  password: "${POSTGRES_PASSWORD:-postgres_password}"
  schema: "calendar"
  sslmode: "${POSTGRES_SSLMODE:-disable}"
