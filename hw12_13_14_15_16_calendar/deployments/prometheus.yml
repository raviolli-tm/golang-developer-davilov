global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: calendar
    static_configs:
      - targets: ["calendar:8888"]

  - job_name: calendar-scheduler
    static_configs:
      - targets: ["scheduler:9102"]

  - job_name: calendar-storer
    static_configs:
      - targets: ["storer:9103"]
